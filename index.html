<!DOCTYPE html>
<html lang="tr">
<head>

<style>
  :root {
    --yesil: #1e6b3e;
    --yesil-koyu: #174f2f;
    --mavi: #2b5797;
    --mavi-koyu: #1f4274;
    --zemin: #f1f4f2;
    --kart: #ffffff;
    --cizgi: #d9dfdb;
    --yazi: #1d2a22;
    --soluk: #6a766f;
    --girdi: #fffde0;
    --girdi-kenar: #c9c27a;
    --genislik: 900px;
    --altin: #8a6a1c;
    --altin-koyu: #6b5014;
    --mor: #5b3b8c;
    --mor-koyu: #43286b;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--zemin);
    color: var(--yazi);
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
    padding-bottom: calc(68px + env(safe-area-inset-bottom, 0px));
  }

  .ust {
    position: sticky; top: 0; z-index: 30;
    background: var(--zemin);
    padding: calc(5px + env(safe-area-inset-top, 0px)) 6px 5px;
    border-bottom: 1px solid var(--cizgi);
  }
  .ust-satir { display: flex; gap: 6px; align-items: center; flex-wrap: nowrap; max-width: var(--genislik); margin: 0 auto; }
  .ara {
    flex: 1 1 0; min-width: 0;
    height: 34px; padding: 0 10px;
    border: 1px solid var(--cizgi); border-radius: 8px;
    font-size: 16px; background: #fff; color: var(--yazi);
  }
  .sag-grup { display: flex; align-items: center; gap: 5px; flex: none; margin-left: auto; }
  .sayi { flex: none; text-align: center; font-size: 9px; line-height: 1.1; color: var(--soluk); font-weight: 600; }
  .sayi b { display: block; font-size: 14px; color: var(--yazi); font-weight: 800; }
  .stopaj {
    display: flex; flex-direction: column; align-items: center; gap: 1px; flex: none;
    font-size: 8.5px; font-weight: 700; color: var(--soluk); line-height: 1;
  }
  .stopaj input {
    width: 36px; height: 26px; padding: 0 2px; text-align: center;
    border: 1px solid var(--girdi-kenar); background: var(--girdi); color: var(--yazi);
    border-radius: 6px; font-size: 16px; font-weight: 700;
  }
  .stopaj input:focus { outline: 2px solid var(--yazi); }
  .kur {
    flex: none; font-size: 10px; line-height: 1.2; color: var(--yazi);
    font-variant-numeric: tabular-nums; white-space: nowrap;
  }
  .kur b { font-weight: 900; }
  .kur .soluk { color: var(--soluk); font-weight: 600; }
  .kur .k-tam, .kur .ek { display: none; }
  .temizle {
    height: 32px; padding: 0 6px; border-radius: 8px; flex: none;
    border: 1px solid var(--cizgi); background: #fff; color: #9b2c2c;
    font-size: 11px; font-weight: 600; white-space: nowrap;
  }

  .sekmeler { display: flex; margin: 5px auto 0; gap: 5px; max-width: var(--genislik); }
  .sekme {
    flex: 1; height: 26px; border: 0; border-radius: 8px; padding: 0 4px;
    font-size: 12px; font-weight: 700; color: #fff; opacity: .55; cursor: pointer;
  }
  .sekme .u { display: none; }
  .sekme.sol { background: var(--yesil); }
  .sekme.sag { background: var(--mavi); }
  .sekme.port { background: var(--altin); }
  .sekme.tahmin { background: var(--mor); }
  .sekme.aktif { opacity: 1; box-shadow: 0 0 0 2px var(--yazi) inset; }
