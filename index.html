<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Temettü Hesaplama</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f7f5; margin: 20px; color: #333; }
    .split-table-container { display: flex; gap: 20px; width: 100%; overflow-x: auto; margin-bottom: 20px; }
    .split-table { background-color: white; border-collapse: collapse; flex: 1; min-width: 500px; font-size: 12px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
    .split-table th { background-color: #274e37; color: white; padding: 8px; border: 1px solid #ccc; font-weight: bold; }
    .split-table td { padding: 6px; border: 1px solid #ccc; vertical-align: middle; }
    .table2-header { background-color: #2b5797 !important; }
    .edit-input { width: 80px; text-align: center; border: 1px solid #ccc; background-color: #ffffe0; font-weight: bold; padding: 4px; border-radius: 3px; }
    .edit-input:focus { outline: 2px solid #274e37; }
    .text-left { text-align: left; padding-left: 10px !important; font-weight: bold; }
    .summary-row td { font-weight: bold; background-color: #f9f9f9; }
    #loading { text-align: center; font-size: 16px; font-weight: bold; color: #274e37; margin-bottom: 20px; }
  </style>
</head>
<body>

  <div id="loading">Veriler ve canlı fiyatlar yükleniyor... Lütfen bekleyin.</div>

  <div class="split-table-container" id="tables-container" style="display: none;">
    <!-- SOL TABLO: AYLIK TEMETTÜ GİRİLECEK -->
    <table class="split-table" id="sol-tablo">
      <thead>
        <tr><th colspan="6">AYLIK TEMETTÜ GİRİLECEK</th></tr>
        <tr><th>HİSSE</th><th>FİYAT</th><th>TEMETTÜ</th><th>LOT</th><th>MALİYET</th><th>AYLIK TEMETTÜ</th></tr>
      </thead>
      <tbody id="sol-body"></tbody>
      <tfoot>
        <tr class="summary-row">
          <td colspan="3" class="text-left">TÜRK LİRASI</td>
          <td id="sol-toplam-lot">-</td>
          <td id="sol-toplam-maliyet">0,00 TL</td>
          <td id="sol-toplam-aylik">0,00 TL</td>
        </tr>
      </tfoot>
    </table>

    <!-- SAĞ TABLO: LOT GİRİLECEK -->
    <table class="split-table" id="sag-tablo">
      <thead>
        <tr><th colspan="6" class="table2-header">LOT GİRİLECEK</th></tr>
        <tr>
          <th class="table2-header">HİSSE</th>
          <th class="table2-header">FİYAT</th>
          <th class="table2-header">TEMETTÜ</th>
          <th class="table2-header">LOT</th>
          <th class="table2-header">MALİYET</th>
          <th class="table2-header">AYLIK TEMETTÜ</th>
        </tr>
      </thead>
      <tbody id="sag-body"></tbody>
      <tfoot>
        <tr class="summary-row">
          <td colspan="3" class="text-left">TOPLAM (TL)</td>
          <td id="sag-toplam-lot">-</td>
          <td id="sag-toplam-maliyet">0,00 TL</td>
          <td id="sag-toplam-aylik">0,00 TL</td>
        </tr>
      </tfoot>
    </table>
  </div>

  <script>
    let hisseVerileri = {}; // Her hisse için fiyat ve temettü bilgisini tutacak
    let hisseListesi = []; // Dinamik olarak temettüsü olan hisse kodlarını tutacak

    // Sayfa açıldığında çalışacak ana fonksiyon
    async function baslat() {
      try {
        // 1. Python botumuzun ürettiği temettü JSON dosyasını okuyoruz
        const temettuRes = await fetch('temettu_veri.json');
        const temettuData = temettuRes.ok ? await temettuRes.json() : {};

        // 2. Anlık (Canlı) hisse fiyatlarını TradingView API'sinden çekiyoruz
        const tvPayload = {
          "columns": ["name", "close"],
          "filter": [{"left": "type", "operation": "in_range", "right": ["stock"]}],
          "range": [0, 1500]
        };
        const tvRes = await fetch('https://scanner.tradingview.com/turkey/scan', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(tvPayload)
        });
        const tvData = tvRes.ok ? await tvRes.json() : { data: [] };
        
        // Gelen canlı fiyatları bir sözlüğe (map) çeviriyoruz
        const fiyatMap = {};
        if (tvData.data) {
          tvData.data.forEach(item => {
            const kod = item.d[0].replace('BIST:', ''); // Kod adını temizle (FROTO gibi)
            const fiyat = parseFloat(item.d[1]) || 0;
            fiyatMap[kod] = fiyat;
          });
        }

        // 3. Temettü verisi olan hisseler ile canlı fiyatları eşleştiriyoruz
        for (const [kod, detay] of Object.entries(temettuData)) {
          if (detay.hisse_basi_tl > 0) {
            hisseVerileri[kod] = {
              temettu: detay.hisse_basi_tl,
              fiyat: fiyatMap[kod] || 0 // TradingView'de fiyatı yoksa 0 ata
            };
            hisseListesi.push(kod);
          }
        }
        
        // Hisseleri A-Z alfabetik sıraya diz
        hisseListesi.sort();
        
        // Yükleme ekranını gizle ve tabloları çiz
        document.getElementById('loading').style.display = 'none';
        document.getElementById('tables-container').style.display = 'flex';
        
        tablolariCiz();
      } catch (e) {
        console.error("Veriler yüklenirken hata oluştu:", e);
        document.getElementById('loading').innerText = "Veriler yüklenirken bir hata oluştu. Lütfen sayfayı yenileyin.";
      }
    }

    // Sayıları Türk Lirası formatında gösterme aracı
    function formatTL(num) {
      return num.toLocaleString('tr-TR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
    }

    // Hisseleri tablolara basan fonksiyon
    function tablolariCiz() {
      const solBody = document.getElementById('sol-body');
      const sagBody = document.getElementById('sag-body');
      solBody.innerHTML = '';
      sagBody.innerHTML = '';

      hisseListesi.forEach((hisse) => {
        const fiyat = hisseVerileri[hisse].fiyat;
        const temettu = hisseVerileri[hisse].temettu;

        // SOL TABLO SATIRI
        const trSol = document.createElement('tr');
        trSol.innerHTML = `
          <td class="text-left">${hisse}</td>
          <td>${formatTL(fiyat)}</td>
          <td>${formatTL(temettu)}</td>
          <td id="sol_lot_${hisse}">0,00</td>
          <td id="sol_maliyet_${hisse}">0,00 TL</td>
          <td><input type="number" class="edit-input" id="sol_aylik_${hisse}" value="1000" oninput="hesaplaSol()"></td>
        `;
        solBody.appendChild(trSol);

        // SAĞ TABLO SATIRI
        const trSag = document.createElement('tr');
        trSag.innerHTML = `
          <td class="text-left">${hisse}</td>
          <td>${formatTL(fiyat)}</td>
          <td>${formatTL(temettu)}</td>
          <td><input type="number" class="edit-input" id="sag_lot_${hisse}" placeholder="0" oninput="hesaplaSag()"></td>
          <td id="sag_maliyet_${hisse}">0,00 TL</td>
          <td id="sag_aylik_${hisse}">0,00 TL</td>
        `;
        sagBody.appendChild(trSag);
      });

      hesaplaSol();
      hesaplaSag();
    }

    // SOL Tablo (Aylık hedefe göre lot ve maliyet) hesaplamaları
    function hesaplaSol() {
      let toplamMaliyet = 0;
      let toplamAylik = 0;

      hisseListesi.forEach((hisse) => {
        const fiyat = hisseVerileri[hisse].fiyat;
        const temettu = hisseVerileri[hisse].temettu;
        const aylikHedefInput = document.getElementById(`sol_aylik_${hisse}`);
        const aylikHedef = parseFloat(aylikHedefInput.value) || 0;
        
        if (aylikHedef > 0 && temettu > 0 && fiyat > 0) {
          const yillikHedef = aylikHedef * 12;
          const lot = yillikHedef / temettu;
          const maliyet = lot * fiyat;

          document.getElementById(`sol_lot_${hisse}`).innerText = formatTL(lot);
          document.getElementById(`sol_maliyet_${hisse}`).innerText = formatTL(maliyet) + " TL";

          toplamMaliyet += maliyet;
          toplamAylik += aylikHedef;
        } else {
          document.getElementById(`sol_lot_${hisse}`).innerText = "0,00";
          document.getElementById(`sol_maliyet_${hisse}`).innerText = "0,00 TL";
        }
      });

      document.getElementById('sol-toplam-maliyet').innerText = formatTL(toplamMaliyet) + " TL";
      document.getElementById('sol-toplam-aylik').innerText = formatTL(toplamAylik) + " TL";
    }

    // SAĞ Tablo (Lota göre aylık temettü ve maliyet) hesaplamaları
    function hesaplaSag() {
      let toplamMaliyet = 0;
      let toplamAylik = 0;

      hisseListesi.forEach((hisse) => {
        const fiyat = hisseVerileri[hisse].fiyat;
        const temettu = hisseVerileri[hisse].temettu;
        const lotInput = document.getElementById(`sag_lot_${hisse}`);
        const lot = parseFloat(lotInput.value) || 0;

        if (lot > 0 && fiyat > 0) {
          const maliyet = lot * fiyat;
          const aylikTemettu = (lot * temettu) / 12;

          document.getElementById(`sag_maliyet_${hisse}`).innerText = formatTL(maliyet) + " TL";
          document.getElementById(`sag_aylik_${hisse}`).innerText = formatTL(aylikTemettu) + " TL";

          toplamMaliyet += maliyet;
          toplamAylik += aylikTemettu;
        } else {
          document.getElementById(`sag_maliyet_${hisse}`).innerText = "0,00 TL";
          document.getElementById(`sag_aylik_${hisse}`).innerText = "0,00 TL";
        }
      });

      document.getElementById('sag-toplam-maliyet').innerText = formatTL(toplamMaliyet) + " TL";
      document.getElementById('sag-toplam-aylik').innerText = formatTL(toplamAylik) + " TL";
    }

    // Uygulamayı çalıştır
    baslat();
  </script>
</body>
</html>
