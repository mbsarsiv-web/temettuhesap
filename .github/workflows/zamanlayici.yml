name: Temettu Otomasyonu
on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:
jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - run: pip install requests beautifulsoup4
      - run: python temettu_bot.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
