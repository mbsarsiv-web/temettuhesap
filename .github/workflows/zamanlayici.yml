name: Temettu Otomasyonu

on:
  schedule:
    # Her Pazar 06:00 UTC = Türkiye saati 09:00
    - cron: '0 6 * * 0'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: temettu-otomasyonu
  cancel-in-progress: false

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Depoyu al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Bağımlılıkları kur
        run: pip install requests

      - name: Botu çalıştır
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
        run: python temettu_bot.py
