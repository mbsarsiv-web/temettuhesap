name: Temettu Otomasyonu

on:
  schedule:
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri kur
        run: pip install requests

      - name: Botu calistir
        run: python temettu_bot.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
