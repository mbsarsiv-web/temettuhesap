name: Temettu Otomasyonu

on:
  schedule:
    # GitHub cron saati UTC'dir. Turkiye UTC+3 oldugu icin 06:00 UTC = 09:00 (TSI).
    # Haftanin gunu: 0 = Pazar  ->  her Pazar sabahi 09:00
    - cron: '0 6 * * 0'
  workflow_dispatch:

jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutuphaneleri kur
        run: pip install requests

      - name: Botu calistir
        run: python temettu_bot.py
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
