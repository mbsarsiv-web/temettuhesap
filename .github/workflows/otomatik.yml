name: Temettü Verisi Güncelleme

on:
  schedule:
    - cron: '0 6 * * 0' # Her Pazar sabahı Türkiye saati ile 09:00'da çalışır
  workflow_dispatch: # Actions sekmesinden manuel çalıştırmaya izin verir

permissions:
  contents: write

jobs:
  guncelle:
    runs-on: ubuntu-latest
    steps:
      - name: Depoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Gerekli Kütüphaneleri Yükle
        run: pip install -r requirements.txt

      - name: Temettü Botunu Çalıştır
        run: python guncelle.py

      - name: Yeni Verileri Depoya Kaydet (Commit & Push)
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add temettu_veri.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "otomatik güncelleme: pazar temettü verileri" && git push)
